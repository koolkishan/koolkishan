name: Latest YouTube videos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCDT8sIFy3pW8LT6SAbe8xtQ"
          max_post_count: 5
          template: "- [$title]($url) <br/><sub>$date</sub>"
          comment_tag_name: "YOUTUBE-VIDEOS"
